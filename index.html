<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixabay Image Search</title>
    <script type="module" crossorigin src="/goit-js-hw-12/index.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-js-hw-12/assets/vendor-S2qh7U4E.js">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-12/assets/vendor-DumFYO8Z.css">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-12/assets/styles-C0VRhitH.css">
  </head>
  <body>
    <header class="page-header">
      <div class="container">
        <h1 class="page-title">Pixabay Image Search</h1>
        <form class="form" id="search-form">
          <input
            class="search-input"
            type="text"
            name="searchQuery"
            autocomplete="off"
            placeholder="Search images..."
          />
          <button class="search-button" type="submit">Search</button>
        </form>
      </div>
    </header>

    <main>
      <section class="gallery-section">
        <div class="container">
          <ul class="gallery" id="gallery"></ul>
          <button class="load-more-button is-hidden" id="load-more-button" type="button">
            Load more
          </button>
          <div class="loader is-hidden" id="loader" aria-hidden="true"></div>
        </div>
      </section>
    </main>

  </body>
</html>
